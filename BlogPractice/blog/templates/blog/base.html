{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tarun Blogs{% endblock %}</title>

    <!-- Local Materialize CSS -->
    <link rel="stylesheet" href="{% static 'css/materialize.min.css' %}">
    <!-- Your custom CSS (loads after Materialize so custom rules win) -->
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body class="grey lighten-4">
    <header>
        <nav class="blue-grey darken-4">
            <div class="nav-wrapper container">
                <a href="{% url 'post_list' %}" class="brand-logo">Django Blog Practice</a>
                <ul class="right">
                    {% if user.is_authenticated %}
                        <li><a href="{% url 'post_new' %}" class="btn indigo waves-effect waves-light">Add new post</a></li>
                    {% endif %}
                </ul>
            </div>
        </nav>
    </header>

    <main class="container" style="margin-top: 32px; margin-bottom: 48px;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Local Materialize JS -->
    <script src="{% static 'js/materialize.min.js' %}"></script>
</body>
</html>
