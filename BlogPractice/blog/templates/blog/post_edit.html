{% extends 'blog/base.html' %}

{% block title %}Edit Post - Django Blog Practice{% endblock %}

{% block content %}
    <article class="post">
        <h2>Post</h2>
        <form method="POST" class="post-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="save btn">Save</button>
        </form>
    </article>
{% endblock %}
