<!doctype html>
<html>
  <head>
    <title>Tarun Blogs</title>
  </head>
  <body>
    <header>
      <a href="{% url 'post_new' %}">Add new Post</a>
      <h1><a href="">Django Blog Practice</a></h1>
    </header>

    <main>
        {% for post in posts %}
        <article>
            <time>published : {{post.published_at}} </time>
            <!-- <h2><a href="">{{post.title}}</a></h2> -->
             <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
            <p>{{post.text|linebreaksbr}}</p>
        </article>
        {% endfor %}
    </main>
  </body>
</html>
